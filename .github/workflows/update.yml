# Rebuilds README.md from https://ai2hired.org/curriculum.json twice a day and commits it
# when it changed (a lesson was published, a title, path, skill figure or page changed).
# Run it by hand: Actions > Update the roadmap > Run workflow.

name: Update the roadmap

on:
  schedule:
    - cron: '41 7 * * *'
    - cron: '41 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: roadmap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Rebuild the README
        run: node tools/build-readme.mjs

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain -- README.md)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "ai2hired roadmap"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Roadmap: curriculum updated"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $attempt), retrying in 20 seconds."
            sleep 20
          done
          exit 1
